name: Normalize NCore Control 1.0.0 release notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-control-v1.0.0-release.yml"

permissions:
  contents: write

jobs:
  normalize-release:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite official release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          cat > RELEASE_NOTES.md <<'EOF'
          # NCore Control 1.0.0

          Première version publique stable de NCore Control pour Windows x64.

          ## Français

          NCore Control fournit une interface dédiée pour installer et gérer plusieurs serveurs NANOS / nanos world.

          ### Fonctions principales

          - Installer un serveur NANOS / nanos world standard
          - Gérer plusieurs instances serveur indépendantes
          - Démarrer et arrêter les serveurs
          - Créer un raccourci Bureau dédié pour chaque serveur géré
          - Supprimer de manière ciblée un serveur géré et son raccourci
          - Gérer les mises à jour de NCore Control
          - Conserver les serveurs NANOS existants et leurs données lors de la désinstallation de NCore Control

          L'installation automatique de NCore Framework n'est pas activée dans NCore Control 1.0.0.

          Pour une installation normale, utilisez :

          `NCore-Control-Setup-1.0.0.exe`

          Le fichier `NCore-Control-1.0.0-win-x64.zip` est le payload technique du canal de mise à jour.

          ## English

          First public stable release of NCore Control for Windows x64.

          NCore Control provides a dedicated interface for installing and managing multiple NANOS / nanos world servers.

          ### Main features

          - Install a standard NANOS / nanos world server
          - Manage multiple independent server instances
          - Start and stop servers
          - Create a dedicated desktop shortcut for each managed server
          - Remove a managed server and its shortcut in a targeted way
          - Manage NCore Control updates
          - Preserve existing NANOS servers and their data when NCore Control is uninstalled

          Automatic installation of NCore Framework is not enabled in NCore Control 1.0.0.

          For normal installation, use:

          `NCore-Control-Setup-1.0.0.exe`

          `NCore-Control-1.0.0-win-x64.zip` is the technical update payload.

          Official repository:
          https://github.com/ncore-framework-official/ncore-control
          EOF

          gh release edit control-v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "NCore Control V1.0.0" \
            --notes-file RELEASE_NOTES.md
